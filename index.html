<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>David Daniel Šlapal</title>
    <meta name="description" content="Digital business card of David Daniel Šlapal">
    <meta name="keywords" content="David Daniel Šlapal, David Šlapal, David Slapal, davieldds, OK2DDS">
    <link rel="canonical" href="https://slap.al">
    <meta property="og:title" content="David Daniel Šlapal">
    <meta property="og:description" content="Digital business card of David Daniel Šlapal">
    <meta property="og:image" content="https://slap.al/dds.webp">
    <meta property="og:url" content="https://slap.al">
    <meta property="og:site_name" content="David Daniel Šlapal">
    <meta property="og:type" content="profile">
    <link rel="icon" href="dds-logo.webp">
    <link rel="apple-touch-icon" href="dds-logo.webp">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            box-sizing: border-box;
            background-color: var(--theme-active-bg);
            color: var(--theme-active-color);
            transition: background-color 0.3s, color 0.3s;
        }

        .text-center {
            margin: auto 0;
        }

        :root {
            --bs-light-bg: #f2faff;
            --bs-light-color: #1d5f8f;
            --bs-dark-bg: #000215;
            --bs-dark-color: #5da8dd;
            --theme-active-bg: var(--bs-light-bg);
            --theme-active-color: var(--bs-light-color);
        }

        .btn-outline-primary {
            --bs-btn-color: var(--theme-active-color);
            --bs-btn-border-color: var(--theme-active-color);
            --bs-btn-hover-color: #fff;
            --bs-btn-hover-bg: var(--theme-active-color);
            --bs-btn-hover-border-color: var(--theme-active-color);
            --bs-btn-focus-shadow-rgb: 13, 110, 253;
            --bs-btn-active-color: #fff;
            --bs-btn-active-bg: var(--theme-active-color);
            --bs-btn-active-border-color: var(--theme-active-color);
            --bs-btn-active-shadow: inset 0 3px 5px rgba(0, 0, 0, 0.125);
            --bs-btn-disabled-color: var(--theme-active-color);
            --bs-btn-disabled-bg: transparent;
            --bs-btn-disabled-border-color: var(--theme-active-color);
            --bs-gradient: none;
        }

        .profile-photo,
        .text-center>h1,
        .social-buttons {
            margin-bottom: 35px;
        }

        h1 {
            font-size: 2rem;
        }

        .profile-photo {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
        }

        .social-btn {
            margin: 5px;
            border-radius: 50px;
            padding: 10px 20px;
        }

        .social-buttons {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --theme-active-bg: var(--bs-dark-bg);
                --theme-active-color: var(--bs-dark-color);
            }
        }
    </style>
</head>

<body>
    <div class="text-center">
        <img src="dds.webp" alt="David Daniel Šlapal logo" class="profile-photo">
        <h1>David Daniel Šlapal</h1>
        <div class="social-buttons">
            <a href="https://www.linkedin.com/in/slapal" target="_blank"
                class="btn btn-outline-primary social-btn"><i class="bi bi-linkedin"></i> LinkedIn</a>
            <a href="https://github.com/davieldds" target="_blank" class="btn btn-outline-primary social-btn"><i
                    class="bi bi-github"></i> GitHub</a>
            <a href="mailto:david@slapal.cz" class="btn btn-outline-primary social-btn"><i
                    class="bi bi-envelope-at-fill"></i> Contact</a>
            <a href="https://adenergetics.tech" target="_blank" class="btn btn-outline-primary social-btn mt-4">
                <i class="bi bi-rocket-takeoff"></i> Testing In Production</a>
            <a href="https://adenergetics.tech" target="_blank" class="btn btn-outline-primary social-btn"><i class="bi bi-battery-charging"></i> AD
                Energetics</a>
            <a href="https://ok2dds.cz" target="_blank" class="btn btn-outline-primary social-btn"><i
                    class="bi bi-broadcast-pin"></i> OK2DDS</a>
        </div>
    </div>
</body>

</html>
